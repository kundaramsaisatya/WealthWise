name: WealthWise tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: WealthWise-AI/package-lock.json
      - name: Install Node.js dependencies
        working-directory: WealthWise-AI
        run: npm ci
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pandas openpyxl
      - name: Check JavaScript syntax
        working-directory: WealthWise-AI
        run: find frontend -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run regression tests
        working-directory: WealthWise-AI
        run: npm test
